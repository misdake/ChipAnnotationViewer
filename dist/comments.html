<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChipAnnotation Comments</title>
    <style>
        :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; color: #1f2328; }
        body { margin: 0; background: #f6f8fa; }
        main { box-sizing: border-box; width: min(840px, 100%); margin: 0 auto; padding: 24px 16px 48px; }
        h1 { margin: 0 0 16px; font-size: 24px; overflow-wrap: anywhere; }
        button { border: 1px solid #8c959f; border-radius: 6px; background: #f6f8fa; padding: 6px 12px; cursor: pointer; }
        button:hover { background: #eef1f4; }
        button:disabled { cursor: default; opacity: .6; }
        form { margin-bottom: 20px; }
        textarea { box-sizing: border-box; display: block; width: 100%; min-height: 120px; resize: vertical; border: 1px solid #8c959f; border-radius: 6px; padding: 10px; font: inherit; line-height: 1.5; }
        .form-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; color: #57606a; font-size: 13px; }
        .login-controls, .form-submit-actions, .comment-toolbar { display: flex; align-items: center; gap: 8px; }
        .form-submit-actions { margin-left: auto; }
        .login-controls button, .form-submit-actions button, .comment-toolbar button { box-sizing: border-box; min-height: 34px; }
        .comment-list-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 8px 0; }
        .comment-toolbar { flex: 0 0 auto; justify-content: flex-end; }
        .comment-toolbar button { min-height: 28px; padding: 4px 9px; font-size: 12px; }
        #comment-submit { color: #fff; border-color: #1f883d; background: #1f883d; }
        #message { min-height: 20px; margin: 0; color: #1a7f37; }
        #message.error { color: #cf222e; }
        .comment { margin-top: 12px; overflow: hidden; border: 1px solid #d0d7de; border-radius: 6px; background: #fff; }
        .comment header { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-bottom: 1px solid #d8dee4; border-radius: 5px 5px 0 0; background: #f6f8fa; color: #57606a; font-size: 13px; }
        .comment header strong { color: #1f2328; }
        .delete-button { margin-left: auto; padding: 3px 8px; color: #cf222e; }
        .comment-content { padding: 12px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.55; }
        .empty { color: #57606a; }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
<main>
    <h1 id="comment-title">Comments</h1>
    <form id="comment-form">
        <textarea id="comment-content" maxlength="10000" required hidden placeholder="Enter a comment (plain text, multiple lines supported)"></textarea>
        <div class="form-actions">
            <div class="login-controls">
                <span id="login-status">Checking login status...</span>
                <button id="login-button" type="button" hidden>Sign in with GitHub</button>
            </div>
            <div id="comment-submit-actions" class="form-submit-actions" hidden>
                <span>Maximum 10,000 characters</span>
                <button id="comment-submit" type="submit">Post comment</button>
            </div>
        </div>
    </form>
    <div class="comment-list-header">
        <div id="message" role="status"></div>
        <div class="comment-toolbar">
            <button id="refresh-button" type="button">Refresh</button>
            <button id="sort-button" type="button"></button>
        </div>
    </div>
    <section id="comment-list" aria-live="polite"></section>
</main>
<script src="comments.js"></script>
</body>
</html>
